name: Restock-Check

on:
  schedule:
    # GitHub startet geplante Läufe nur grob alle 20–30 Min. Darum prüft jeder Lauf
    # selbst ca. 30 Min. lang alle 3 Min.; der nächste Lauf wartet in der Warteschlange.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      shop_test:
        description: "Nur Shop-Test (jeden Shop einmal prüfen, Bericht per Telegram)"
        type: boolean
        default: false

# Shop-Test läuft getrennt, damit er nicht hinter einem 30-Minuten-Lauf warten muss
concurrency:
  group: ${{ inputs.shop_test && 'shop-test' || 'restock-check' }}
  cancel-in-progress: false

# Schreibrecht, damit die per Telegram geänderte Suchliste (watchlist.json) gespeichert wird
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Neuesten Stand holen (nicht den vom Startzeitpunkt) – sonst fehlen Änderungen aus dem Lauf davor
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Zustand (welche Angebote schon gemeldet wurden) zwischen den Läufen merken
      - name: Zustand laden
        if: ${{ !inputs.shop_test }}
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Shops prüfen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_AUFSCHLAG_PROZENT: ${{ vars.MAX_AUFSCHLAG_PROZENT || '10' }}
          REGION: ${{ vars.REGION || 'AT' }}
          SPRACHEN: ${{ vars.SPRACHEN || (vars.REGION == 'EU' && 'de,en' || 'de') }}
          CHF_FAKTOR: ${{ vars.CHF_FAKTOR || '1.0' }}
          SHOP_TEST: ${{ inputs.shop_test && '1' || '0' }}
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '30' || '0' }}
          INTERVAL_SECONDS: "180"
        run: python bot.py

      - name: Zustand speichern
        if: ${{ always() && !inputs.shop_test }}
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: state-${{ github.run_id }}

      - name: Suchliste speichern
        if: ${{ always() && !inputs.shop_test }}
        run: |
          if [ -n "$(git status --porcelain watchlist.json)" ]; then
            git config user.name "pokemon-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add watchlist.json
            git commit -m "Suchliste per Telegram geändert"
            git pull --rebase
            git push
          else
            echo "Suchliste unverändert"
          fi
